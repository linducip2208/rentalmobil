# ─── Queue Worker ──────────────────────────────────────────────
[program:rentalmobil-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/rentalmobil/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/rentalmobil-queue.log
stopwaitsecs=3600
stopsignal=QUIT

# ─── Scheduler ─────────────────────────────────────────────────
[program:rentalmobil-scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while [ true ]; do php /var/www/rentalmobil/artisan schedule:run --verbose --no-interaction & sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/rentalmobil-scheduler.log
stopasgroup=true
killasgroup=true

# ─── Horizon (alternative — gunakan salah satu queue worker) ───
# [program:rentalmobil-horizon]
# process_name=%(program_name)s
# command=php /var/www/rentalmobil/artisan horizon
# autostart=true
# autorestart=true
# user=www-data
# redirect_stderr=true
# stdout_logfile=/var/log/supervisor/rentalmobil-horizon.log
# stopwaitsecs=3600
# stopsignal=QUIT

# ─── Supervisor group ──────────────────────────────────────────
[group:rentalmobil]
programs=rentalmobil-queue,rentalmobil-scheduler
priority=999
